<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <g fill="none" stroke="#1c3d5a" stroke-width="3" stroke-linecap="round">
    <!-- two facing contact blades with an open gap between them, reading as an S; IEC break-contact style -->
    <line x1="9" y1="12" x2="24" y2="27" />
    <line x1="24" y1="33" x2="9" y2="48" />
  </g>
  <g fill="#1c3d5a" stroke="none">
    <circle cx="9" cy="12" r="2.5" />
    <circle cx="24" cy="27" r="2.5" />
    <circle cx="24" cy="33" r="2.5" />
    <circle cx="9" cy="48" r="2.5" />
  </g>
  <text x="46" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="26"
        font-weight="600" fill="#1c3d5a">Schematika</text>
</svg>
