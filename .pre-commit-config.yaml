repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: true

      - id: bandit
        name: bandit (security)
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: true

      - id: vulture
        name: vulture (dead code, advisory)
        entry: uv run vulture --min-confidence 80
        language: system
        types: [python]
        pass_filenames: true
        verbose: true

      - id: radon-cc
        name: radon (cyclomatic complexity)
        entry: uv run radon cc -s -n C
        language: system
        types: [python]
        pass_filenames: true

      - id: radon-mi
        name: radon (maintainability index)
        entry: uv run radon mi -s -n B
        language: system
        types: [python]
        pass_filenames: true

      - id: import-linter
        name: import-linter (layering contracts)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: interrogate
        name: interrogate (docstring coverage)
        entry: uv run interrogate src/schematika
        language: system
        pass_filenames: false
        always_run: true

      - id: darglint
        name: darglint (docstring/signature consistency)
        entry: uv run darglint
        language: system
        types: [python]
        files: ^src/schematika/
        pass_filenames: true

      - id: codesight-wiki
        name: codesight (AST wiki, advisory)
        entry: npx -y codesight --wiki
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: fp-purity-gate
        name: fp purity gate (advisory)
        entry: uv run python claude-tools/fp_purity_gate.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: api-style-gate
        name: api style gate (advisory)
        entry: uv run python claude-tools/api_style_gate.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
