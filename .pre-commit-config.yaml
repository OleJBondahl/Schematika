repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        files: ^(src|tests)/
        pass_filenames: true

      - id: vulture
        name: vulture (dead code, strict)
        entry: uv run vulture src --min-confidence 80
        language: system
        pass_filenames: false
        always_run: true

      - id: import-linter
        name: import-linter (layering contracts)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: codesight-wiki
        name: codesight (AST wiki, advisory)
        entry: npx -y codesight --wiki
        language: system
        pass_filenames: false
        always_run: true
        verbose: true

      - id: fp-purity-gate
        name: fp purity gate (strict)
        entry: uv run python scripts/fp_purity_gate.py
        language: system
        pass_filenames: false
        always_run: true

      - id: api-style-gate
        name: api style gate (strict)
        entry: uv run python scripts/api_style_gate.py --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: api-docs-audit
        name: api docs audit (strict)
        entry: uv run python scripts/api_docs_audit.py --strict
        language: system
        pass_filenames: false
        always_run: true

      - id: ratchet
        name: numeric ratchet (fast)
        entry: uv run python scripts/ratchet_check.py --fast
        language: system
        pass_filenames: false
        always_run: true
