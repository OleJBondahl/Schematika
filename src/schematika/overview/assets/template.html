<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TITLE_TAG</title>
  CDN_TAG
  <style>
    html, body { height: 100%; }
    body { margin: 0; font: 13px monospace; background: #0d1117; color: #c9d1d9;
           display: flex; flex-direction: column; }
    #titlebar { box-sizing: border-box; display: flex; align-items: center;
                gap: 8px 16px; flex-wrap: wrap; padding: 12px 16px;
                background: #161b22; border-bottom: 1px solid #30363d; font-weight: bold; }
    #titlebar button { flex-shrink: 0; }
    #titlebar .ver { color: #58a6ff; }
    #legend { display: flex; gap: 8px 14px; font-weight: normal; font-size: 11px; flex-wrap: wrap;
              align-items: center; }
    #legend .item { display: flex; align-items: center; gap: 4px; }
    #legend .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
    #main { display: flex; flex: 1; min-height: 0; }
    #cy { flex: 1; height: 100%; }
    #cy.tracing { box-shadow: inset 0 0 0 3px #58a6ff; }
    #panel { width: 340px; height: 100%; overflow-y: auto; padding: 12px; box-sizing: border-box;
             border-left: 1px solid #30363d; background: #161b22; }
    #search { width: 100%; padding: 6px; box-sizing: border-box; background: #0d1117;
              color: #c9d1d9; border: 1px solid #30363d; margin-bottom: 8px; }
    .sig { padding: 4px 6px; cursor: pointer; border-radius: 4px; }
    .sig:hover { background: #21262d; }
    .break { color: #f85149; }
    h3 { margin: 8px 0 4px; }
    li { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="titlebar">
    <span>TITLE_TAG <span class="ver" id="verlabel">VERLABEL_TAG</span></span>
    <div id="legend"></div>
  </div>
  <div id="main">
    <div id="cy"></div>
    <div id="panel">
      <input id="search" placeholder="search signals / labels…" />
      <div id="siglist"></div>
      <div id="detail"></div>
    </div>
  </div>
  APP_TAG
</body>
</html>
