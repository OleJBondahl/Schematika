[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schematika"
version = "0.1.7"
description = "A Python library for creating electrical schematic diagrams programmatically"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ole Johan Bondahl" }
]
keywords = ["electrical", "schematic", "diagram", "svg", "iec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Add any runtime dependencies here
dependencies = []

[project.optional-dependencies]
pdf = ["typst"]
cable = ["wireviz"]
pcb = ["skidl>=2.2.3,<3"]
excel = ["openpyxl"]
mcp = ["mcp>=1.0"]
dev = ["cairosvg", "playwright"]

[project.urls]
Homepage = "https://github.com/OleJBondahl/Schematika"
Repository = "https://github.com/OleJBondahl/Schematika"
Issues = "https://github.com/OleJBondahl/Schematika/issues"



[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["schematika*"]

[tool.setuptools.package-data]
schematika = ["rendering/typst/templates/*.typ"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=src --cov-report=term-missing"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "darglint>=1.8.1",
    "deal>=4.24.6",
    "hypothesis>=6.104",
    "import-linter>=2.11",
    "interrogate>=1.7.0",
    "mutmut>=3.5.0",
    "pdoc>=16.0.0",
    "pre-commit>=4.5.1",
    "pymupdf>=1.27.2.2",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-examples>=0.0.18",
    "radon>=6.0.1",
    "ruff>=0.15.0",
    "ty>=0.0.16",
    "vulture>=2.15",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
# Same as Black.
line-length = 88
# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "FA",   # flake8-future-annotations
    "N",    # pep8-naming
    "D",    # pydocstyle
    "ARG",  # flake8-unused-arguments
    "PLR",  # pylint refactor
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "C90",  # mccabe complexity (replaces complexipy)
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]  # isort disabled: system.system must be first to avoid circular imports
# Inline Typst code in string literals has long lines
"src/schematika/rendering/typst/compiler.py" = ["E501"]
"tests/**/*.py" = ["E501"]
# tests/** ignores:
#   D    — no pydocstyle on test fixtures/asserts
#   ARG  — fixture/subclass params aren't always used
#   PLR2004 — "magic value" comparisons are the whole point of assertions
#   PLR0913 — parametrised fixtures legitimately take many args
"tests/**" = ["D", "ARG", "PLR2004", "PLR0913"]
"src/schematika/**/__init__.py" = ["D104"]

[tool.ty.src]
exclude = ["tools/"]

[tool.interrogate]
fail-under = 0
verbose = 1

[tool.coverage.run]
# schematika.mcp.__main__ has no `if __name__ == "__main__":` guard — importing
# it calls mcp.run() and blocks on stdio. Omit from coverage; the server module
# itself is smoke-tested in tests/unit/test_mcp_smoke.py.
omit = ["src/schematika/mcp/__main__.py"]
